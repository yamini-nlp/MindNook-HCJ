<!DOCTYPE html>
<html lang="en" class="mn-auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./images/mindnook-logo.ico">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="explanation_panel.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="env.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <script src="hyperbole_lexicon.js"></script>
    <script src="baseline_constants.js"></script>
    <script src="personal_baseline.js"></script>
    <script src="utility_decomposition.js"></script>
    <script src="lstm_temporal.js"></script>
    <script src="goal_clarification.js"></script>
    <script src="crisis_screen.js"></script>
    <script src="crisis_banner.js"></script>
    <script src="explanation_panel.js"></script>
    <link rel="stylesheet" href="sidebar_nav.css">
    <link rel="stylesheet" href="design-tokens.css">
    <link rel="stylesheet" href="shared-components.css">
    <title>MindNook | Canvas Editor</title>
    <style>
        html.mn-auth-pending body{visibility:hidden}
        html.mn-auth-ready body{visibility:visible}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden}

        /* ---------- Canvas picker ---------- */
        .canvas-picker-view{background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:80px 20px;color:var(--text)}
        .picker-headline{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,4.5vw,2.8rem);font-weight:400;letter-spacing:1px;line-height:1.1;margin-bottom:8px;text-align:center}
        .picker-headline em{font-style:italic;color:var(--gold2)}
        .picker-sub{color:var(--text2);font-size:0.9rem;letter-spacing:0.3px;margin-bottom:10px}
        .page-title-rule{width:40px;height:2px;background:var(--gold2);border-radius:2px;margin:10px auto 48px}

        .draft-banner{max-width:560px;width:100%;background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:32px;animation:mn-fade-in 0.3s ease}
        .draft-banner p{font-size:0.82rem;color:var(--text2);line-height:1.5}
        .draft-banner strong{color:var(--gold2)}
        .draft-banner-actions{display:flex;gap:8px;flex-shrink:0}
        .draft-btn{border:none;border-radius:30px;padding:7px 16px;font-size:0.76rem;font-family:'DM Sans',sans-serif;cursor:pointer;letter-spacing:0.3px;transition:all 0.2s}
        .draft-btn.resume{background:var(--gold);color:var(--bg3);font-weight:500}
        .draft-btn.resume:hover{background:var(--gold3)}
        .draft-btn.discard{background:transparent;border:1px solid var(--border2);color:var(--text2)}
        .draft-btn.discard:hover{color:var(--rose);border-color:var(--rose)}

        .canvas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;max-width:900px;width:100%}
        .canvas-square{padding:28px 15px;background:var(--card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden}
        .canvas-square::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:16px 16px 0 0;background:transparent;transition:background 0.3s}
        .canvas-square:hover{background:var(--card2);transform:translateY(-4px);border-color:var(--border2)}
        .canvas-square:hover::before{background:var(--teal)}
        .canvas-square:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
        .canvas-square.active{background:var(--card2);border-color:var(--gold2)}
        .canvas-square.active::before{background:var(--gold2)}
        .canvas-square-icon{font-size:2rem}
        .canvas-square p{font-size:0.8rem;color:var(--text2);letter-spacing:0.5px;font-family:'DM Sans',sans-serif;font-weight:400;text-align:center}
        .canvas-square.active p{color:var(--gold)}
        .canvas-square-check{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--gold2);color:var(--bg3);font-size:0.65rem;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.6);transition:all 0.25s}
        .canvas-square.active .canvas-square-check{opacity:1;transform:scale(1)}

        .picker-footer-nav{margin-top:48px;display:flex;gap:14px;align-items:center}
        .nav-btn{padding:10px 28px;border-radius:50px;font-size:0.85rem;font-weight:500;cursor:pointer;transition:all 0.25s;font-family:'DM Sans',sans-serif;letter-spacing:0.5px;border:none}
        .nav-btn.secondary{background:transparent;border:1px solid var(--border2);color:var(--text2);text-decoration:none;display:inline-block}
        .nav-btn.secondary:hover{background:rgba(217,197,178,0.08);color:var(--text);border-color:var(--gold)}
        .nav-btn.primary{background:var(--gold);color:var(--bg3);border:none;font-weight:500}
        .nav-btn.primary:hover:not(.disabled){background:var(--gold3)}
        .nav-btn.primary.disabled{background:var(--card2);color:var(--text3);cursor:not-allowed;border:1px solid var(--border)}
        .nav-btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

        /* ---------- Editor ---------- */
        .editor-view{min-height:100vh;background:var(--bg);padding-bottom:50px;animation:mn-fade-in 0.35s ease}
        @keyframes mn-fade-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
        .editor-top-nav{display:flex;justify-content:space-between;align-items:center;padding:20px 60px;border-bottom:1px solid var(--border);gap:16px;flex-wrap:wrap}
        .editor-top-left{display:flex;align-items:center;gap:14px}
        .nav-action-btn{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:8px 20px;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:0.82rem;cursor:pointer;transition:all 0.25s;letter-spacing:0.5px}
        .nav-action-btn:hover{background:rgba(217,197,178,0.08);color:var(--text)}
        .nav-action-btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
        .nav-action-btn.primary{background:var(--gold);color:var(--bg3);border-color:var(--gold);font-weight:500}
        .nav-action-btn.primary:hover:not(:disabled){background:var(--gold3)}
        .nav-action-btn.primary:disabled{opacity:0.45;cursor:not-allowed}
        .canvas-badge{font-family:'Playfair Display',serif;font-size:0.95rem;color:var(--gold2);opacity:0.9;letter-spacing:1px;white-space:nowrap}
        .autosave-indicator{font-size:0.72rem;color:var(--text3);letter-spacing:0.3px;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity 0.3s}
        .autosave-indicator.show{opacity:1}
        .autosave-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0}

        .paper-container{display:flex;flex-direction:column;align-items:center;padding:32px 20px}

        .ql-toolbar.ql-snow{background:var(--card)!important;border:1px solid var(--border2)!important;border-radius:50px!important;padding:8px 22px!important;margin-bottom:20px;box-shadow:0 2px 18px rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;width:fit-content;gap:2px}
        .ql-toolbar.ql-snow .ql-formats{margin-right:10px!important;display:flex;align-items:center}
        .ql-toolbar.ql-snow .ql-stroke{stroke:var(--text2)!important}
        .ql-toolbar.ql-snow .ql-fill{fill:var(--text2)!important}
        .ql-toolbar.ql-snow button{border-radius:8px;transition:background 0.15s}
        .ql-toolbar.ql-snow button:hover{background:rgba(217,197,178,0.08)}
        .ql-toolbar.ql-snow button:hover .ql-stroke,.ql-toolbar.ql-snow button.ql-active .ql-stroke{stroke:var(--gold)!important}
        .ql-toolbar.ql-snow button:hover .ql-fill,.ql-toolbar.ql-snow button.ql-active .ql-fill{fill:var(--gold)!important}
        .ql-toolbar.ql-snow button.ql-active{background:rgba(217,197,178,0.12)}

        /* Picker base */
        .ql-toolbar.ql-snow .ql-picker{height:28px}
        .ql-toolbar.ql-snow .ql-picker-label{color:var(--text2)!important;border-radius:8px;display:flex!important;align-items:center;padding-left:10px!important;transition:background 0.15s}
        .ql-toolbar.ql-snow .ql-picker-label:hover{color:var(--gold)!important;background:rgba(217,197,178,0.08)}
        .ql-toolbar.ql-snow .ql-picker-label.ql-active{color:var(--gold)!important}
        .ql-toolbar.ql-snow .ql-picker-label svg{right:8px!important}
        .ql-toolbar.ql-snow .ql-picker-options{background:var(--card2)!important;border:1px solid var(--border2)!important;border-radius:12px!important;color:var(--text)!important;padding:6px!important;box-shadow:0 8px 30px rgba(0,0,0,0.35);max-height:260px;overflow-y:auto}
        .ql-toolbar.ql-snow .ql-picker-item{color:var(--text2)!important;border-radius:6px;padding:6px 12px!important}
        .ql-toolbar.ql-snow .ql-picker-item:hover{color:var(--gold)!important;background:rgba(217,197,178,0.08)!important}
        .ql-toolbar.ql-snow .ql-picker-item.ql-selected{color:var(--gold)!important}

        /* Font picker: fixed collision between long font names and the caret icon */
        .ql-toolbar.ql-snow .ql-picker.ql-font{width:176px}
        .ql-toolbar.ql-snow .ql-picker.ql-font .ql-picker-label{
            width:100%;
            padding-right:28px!important;
            font-size:0.82rem;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .ql-toolbar.ql-snow .ql-picker.ql-font .ql-picker-label::before{
            display:inline-block;
            max-width:100%;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
            line-height:26px;
        }
        .ql-toolbar.ql-snow .ql-picker.ql-font .ql-picker-options{width:220px}
        .ql-toolbar.ql-snow .ql-picker.ql-font .ql-picker-item::before{
            display:inline-block;
            max-width:100%;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
            vertical-align:middle;
        }

        /* Size picker gets the same treatment for consistency */
        .ql-toolbar.ql-snow .ql-picker.ql-size{width:88px}
        .ql-toolbar.ql-snow .ql-picker.ql-size .ql-picker-label{width:100%;padding-right:26px!important;font-size:0.82rem}

        .ql-container.ql-snow{border:none!important;width:100%;max-width:800px;margin:0 auto}
        .ql-editor{background-color:#fff!important;min-height:75vh;padding:50px!important;box-shadow:0 4px 40px rgba(0,0,0,0.3);border-radius:4px;font-family:'Times New Roman',serif!important;font-size:1.1rem!important;color:#333!important}
        .ql-editor.ql-blank::before{color:rgba(0,0,0,0.35)!important;font-style:normal!important}

        .word-count-pill{margin-top:14px;font-size:0.75rem;color:var(--text3);letter-spacing:0.4px;display:flex;gap:14px}
        .word-count-pill span b{color:var(--text2);font-weight:500}

        .theme-floral .ql-editor{background-color:#f5c9d7!important;background-image:url('https://www.transparenttextures.com/patterns/rose-petals.png')!important}
        .theme-ruled .ql-editor{background-image:linear-gradient(#e0e0e0 1px,transparent 1px)!important;background-size:100% 3rem!important;line-height:3rem!important;background-color:#fffaf0!important}
        .theme-midnight .ql-editor{background-color:#001f3f!important;color:#77ffff!important;text-shadow:0 0 5px #77ffff,0 0 10px #77ffff,0 0 20px #00d2ff}
        .editor-view.theme-parchment .ql-editor{background-color:#f4e4bc!important;background-image:url('https://www.transparenttextures.com/patterns/parchment.png')!important;color:#5f4b32!important}
        .theme-lavender .ql-editor{background-color:#e6e6fa!important;background-image:radial-gradient(#d8bfd8 15%,transparent 16%),radial-gradient(#d8bfd8 15%,transparent 16%)!important;background-size:40px 40px!important;color:#4b0082!important}
        .theme-minimal .ql-editor{background-color:#ffffff!important;color:#333!important}
        .theme-matcha .ql-editor{background:linear-gradient(180deg,#d1e2c4 0%,#f0f7ea 20%,#ffffff 100%)!important;color:#3e5a2e!important;border:2px solid #a8c69f!important}
        .theme-sunset .ql-editor{background:linear-gradient(180deg,#ffef96 0%,#ffb458 50%,#f96161 100%)!important;color:#fffaf0!important}
        .theme-noir .ql-editor{background-color:#000000!important;color:#d4af37!important;font-family:'Snell Roundhand',cursive!important}
        .theme-ocean .ql-editor{background:linear-gradient(180deg,#001f3f 0%,#003366 50%,#005b96 100%)!important;color:#e0f7fa!important}

        .ql-size-10px{font-size:10px!important}.ql-size-11px{font-size:11px!important}.ql-size-12px{font-size:12px!important}.ql-size-13px{font-size:13px!important}.ql-size-14px{font-size:14px!important}.ql-size-15px{font-size:15px!important}.ql-size-16px{font-size:16px!important}.ql-size-17px{font-size:17px!important}.ql-size-18px{font-size:18px!important}.ql-size-19px{font-size:19px!important}.ql-size-20px{font-size:20px!important}.ql-size-21px{font-size:21px!important}.ql-size-22px{font-size:22px!important}.ql-size-23px{font-size:23px!important}.ql-size-24px{font-size:24px!important}.ql-size-25px{font-size:25px!important}.ql-size-26px{font-size:26px!important}.ql-size-27px{font-size:27px!important}.ql-size-28px{font-size:28px!important}.ql-size-29px{font-size:29px!important}.ql-size-30px{font-size:30px!important}

        .ql-picker.ql-font .ql-picker-label::before{content:'Times'!important}
        .ql-picker.ql-font .ql-picker-label[data-value="times"]::before,.ql-picker.ql-font .ql-picker-item[data-value="times"]::before{content:'Times'!important}
        .ql-picker.ql-font .ql-picker-label[data-value="bookman"]::before,.ql-picker.ql-font .ql-picker-item[data-value="bookman"]::before{content:'Bookman'!important}
        .ql-picker.ql-font .ql-picker-label[data-value="apple-chancery"]::before,.ql-picker.ql-font .ql-picker-item[data-value="apple-chancery"]::before{content:'Apple Chancery'!important;font-family:'Apple Chancery',cursive}
        .ql-picker.ql-font .ql-picker-label[data-value="big-caslon"]::before,.ql-picker.ql-font .ql-picker-item[data-value="big-caslon"]::before{content:'Big Caslon'!important;font-family:'Big Caslon',serif}
        .ql-picker.ql-font .ql-picker-label[data-value="bradley-hand"]::before,.ql-picker.ql-font .ql-picker-item[data-value="bradley-hand"]::before{content:'Bradley Hand'!important;font-family:'Bradley Hand',cursive}
        .ql-picker.ql-font .ql-picker-label[data-value="chalkduster"]::before,.ql-picker.ql-font .ql-picker-item[data-value="chalkduster"]::before{content:'Chalkduster'!important;font-family:'Chalkduster',cursive}
        .ql-picker.ql-font .ql-picker-label[data-value="copperplate"]::before,.ql-picker.ql-font .ql-picker-item[data-value="copperplate"]::before{content:'Copperplate'!important;font-family:'Copperplate',serif}
        .ql-picker.ql-font .ql-picker-label[data-value="impact"]::before,.ql-picker.ql-font .ql-picker-item[data-value="impact"]::before{content:'Impact'!important;font-family:'Impact',sans-serif}
        .ql-picker.ql-font .ql-picker-label[data-value="market-felt"]::before,.ql-picker.ql-font .ql-picker-item[data-value="market-felt"]::before{content:'Market Felt'!important;font-family:'Market Felt',cursive}
        .ql-picker.ql-font .ql-picker-label[data-value="luminari"]::before,.ql-picker.ql-font .ql-picker-item[data-value="luminari"]::before{content:'Luminari'!important;font-family:'Luminari',fantasy}
        .ql-picker.ql-font .ql-picker-label[data-value="noteworthy"]::before,.ql-picker.ql-font .ql-picker-item[data-value="noteworthy"]::before{content:'Noteworthy'!important;font-family:'Noteworthy',sans-serif}
        .ql-picker.ql-font .ql-picker-label[data-value="palatino"]::before,.ql-picker.ql-font .ql-picker-item[data-value="palatino"]::before{content:'Palatino'!important;font-family:'Palatino',serif}
        .ql-picker.ql-font .ql-picker-label[data-value="rockhand"]::before,.ql-picker.ql-font .ql-picker-item[data-value="rockhand"]::before{content:'Rockwell'!important;font-family:'Rockwell',cursive}
        .ql-picker.ql-font .ql-picker-label[data-value="snell-roundhand"]::before,.ql-picker.ql-font .ql-picker-item[data-value="snell-roundhand"]::before{content:'Snell Roundhand'!important;font-family:'Snell Roundhand',cursive}
        .ql-picker.ql-font .ql-picker-label[data-value="papyrus"]::before,.ql-picker.ql-font .ql-picker-item[data-value="papyrus"]::before{content:'Papyrus'!important;font-family:'Papyrus',fantasy}
        .ql-picker.ql-size .ql-picker-label::before{content:'10px'!important}
        .ql-picker.ql-size .ql-picker-label[data-value]::before{content:attr(data-value)!important}
        .ql-picker.ql-size .ql-picker-item::before{content:attr(data-value)!important}

        /* ---------- Toast ---------- */
        .mn-toast-stack{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:99998;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
        .mn-toast{pointer-events:auto;background:var(--card2);border:1px solid var(--border2);color:var(--text);padding:12px 22px;border-radius:50px;font-size:0.82rem;box-shadow:0 8px 28px rgba(0,0,0,0.35);display:flex;align-items:center;gap:10px;animation:mn-toast-in 0.25s ease;max-width:90vw}
        .mn-toast.warn{border-color:rgba(196,120,138,0.5);color:var(--rose)}
        @keyframes mn-toast-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

        /* ---------- Explain view ---------- */
        .explain-view{min-height:100vh;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px}
        .explain-view-card{width:100%;max-width:640px;background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:32px;animation:mn-fade-in 0.35s ease}
        .explain-view-title{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--gold2);margin-bottom:6px}
        .explain-view-sub{color:var(--text2);font-size:0.85rem;margin-bottom:24px}
        .explain-continue-row{display:flex;justify-content:flex-end;margin-top:24px}
        #explain-continue-btn{padding:10px 28px;border-radius:50px;font-size:0.85rem;font-weight:500;cursor:pointer;background:var(--gold);color:var(--bg3);border:none;font-family:'DM Sans',sans-serif}
        #explain-continue-btn:hover{background:var(--gold3)}
        #explain-continue-btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

        @media(max-width:900px){
            .editor-top-nav{padding:14px 20px}
            .canvas-picker-view{padding:40px 16px}
            .canvas-grid{grid-template-columns:repeat(2,1fr);gap:12px}
            .canvas-square{padding:20px 10px}
            .canvas-square-icon{font-size:1.6rem}
            .picker-footer-nav{flex-direction:column;align-items:stretch;gap:10px;margin-top:32px}
            .nav-btn{width:100%;text-align:center;padding:12px 20px;font-size:0.88rem}
            .draft-banner{flex-direction:column;align-items:stretch;text-align:center}
            .draft-banner-actions{justify-content:center}
            .paper-container{padding:16px 10px}
            .ql-toolbar.ql-snow{border-radius:12px!important;padding:6px 12px!important;flex-wrap:wrap;width:100%!important}
            .ql-toolbar.ql-snow .ql-picker.ql-font{width:150px}
            .ql-container.ql-snow{max-width:100%}
            .ql-editor{padding:24px 18px!important;font-size:1rem!important;min-height:60vh}
        }
        @media(max-width:380px){
            .canvas-grid{grid-template-columns:1fr 1fr;gap:10px}
            .ql-toolbar.ql-snow .ql-picker.ql-font{width:128px}
        }
        @media(prefers-reduced-motion:reduce){
            *{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition-duration:0.001ms!important}
        }
    </style>
</head>
<body>
<script src="sidebar_nav.js"></script>

    <div class="mn-toast-stack" id="mn-toast-stack" aria-live="polite"></div>

    <div id="picker-view" class="canvas-picker-view">
        <h1 class="picker-headline">Select Your <em>Canvas</em></h1>
        <p class="picker-sub">Choose a style that matches your mood today</p>
        <div class="page-title-rule"></div>

        <div id="draft-banner" class="draft-banner" style="display:none">
            <p><strong>You have an unfinished entry.</strong><br>Pick up where you left off, or start fresh.</p>
            <div class="draft-banner-actions">
                <button type="button" class="draft-btn resume" id="draft-resume-btn">Resume</button>
                <button type="button" class="draft-btn discard" id="draft-discard-btn">Discard</button>
            </div>
        </div>

        <div class="canvas-grid" id="canvas-grid"></div>
        <div class="picker-footer-nav">
            <button id="start-writing" class="nav-btn primary disabled" disabled aria-disabled="true">Start Writing →</button>
        </div>
    </div>

    <div id="editor-view" class="editor-view" style="display:none">
        <div class="editor-top-nav">
            <div class="editor-top-left">
                <button class="nav-action-btn" id="back-btn">← Back</button>
                <span class="autosave-indicator" id="autosave-indicator"><span class="autosave-dot"></span><span id="autosave-text">Draft saved</span></span>
            </div>
            <span class="canvas-badge" id="badge"></span>
            <button class="nav-action-btn primary" id="save-btn" disabled>Save &amp; Analyze ✓</button>
        </div>
        <div class="paper-container">
            <div id="editor"></div>
            <div class="word-count-pill" id="word-count-pill">
                <span><b id="wc-words">0</b> words</span>
                <span><b id="wc-sentences">0</b> sentences</span>
            </div>
        </div>
    </div>

    <div id="explain-view" class="explain-view">
        <div class="explain-view-card">
            <div class="explain-view-title">Entry saved ✓</div>
            <div class="explain-view-sub">Here's why Nook AI responded the way it will on your next check-in.</div>
            <div id="explain-panel-container"></div>
            <div class="explain-continue-row">
                <button type="button" id="explain-continue-btn">Continue →</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const SUPABASE_URL=window._env.SUPABASE_URL;
        const SUPABASE_ANON_KEY=window._env.SUPABASE_ANON_KEY;
        const supabaseClient=window.__sb;

        const POS_WORDS=new Set(['happy','happiness','joy','joyful','glad','grateful','gratitude','thankful','love','loved','loving','hopeful','hope','peace','peaceful','calm','content','contented','proud','pride','excited','excitement','inspired','inspiration','motivated','motivation','amazing','wonderful','fantastic','great','good','excellent','beautiful','blessed','cheerful','delight','delighted','energised','energized','enthusiastic','optimistic','pleased','positive','radiant','refreshed','satisfied','uplifted','warm','bright','elated','ecstatic','confident','empowered','fulfilled','lively','playful','serene','sunny','thrilled','victorious','vibrant','alive','appreciative','brave','caring','creative','eager','free','generous','gentle','glowing','graceful','healing','honest','imaginative','kind','light','mindful','nurturing','open','patient','resilient','safe','strong','tender','trusting','whole','wise','fun','laugh','smile','smiling','enjoy','enjoyed','enjoying','celebrate','celebration','achievement','accomplish','accomplished','success','successful','progress','grow','growth','adventure']);
        const NEG_WORDS=new Set(['sad','sadness','angry','anger','tired','tiredness','stress','stressed','worry','worried','fear','fearful','lonely','loneliness','hurt','pain','painful','lost','dark','difficult','struggle','struggling','hopeless','anxious','anxiety','frustrated','frustration','overwhelmed','exhausted','exhaustion','upset','depressed','depression','nervous','scared','terrible','awful','horrible','miserable','disappointed','disappointment','annoyed','confused','helpless','weak','broken','cry','crying','tears','grief','grieving','regret','regretful','shame','ashamed','guilt','guilty','hate','hatred','bored','boredom','burned','burnout','chaos','chaotic','cruel','defeated','desperate','doubt','dread','dull','empty','fail','failure','gloomy','heavy','hollow','ignored','insecure','irritated','jealous','meaningless','numb','panicked','paralysed','paralyzed','powerless','rejection','resentment','restless','shattered','sorrow','stuck','suffering','tense','tension','tragic','trapped','troubled','uncertain','uncomfortable','unfair','unhappy','unloved','unworthy','useless','vulnerable','worthless','wrong','mistake','mistakes','hard','bad','worse','worst','never','cannot','alone','miss','missing']);

        function localAnalysis(text){
            const words=text.trim().split(/\s+/).filter(w=>w.length>0);
            const sentences=text.split(/[.!?]+/).filter(s=>s.trim().length>3);
            const uniqueSet=new Set(words.map(w=>w.toLowerCase().replace(/[^a-z]/g,'')));
            let posCount=0,negCount=0;
            const emotionWords=[];
            words.forEach(w=>{
                const clean=w.toLowerCase().replace(/[^a-z]/g,'');
                const forms=[clean,clean.replace(/ing$/,''),clean.replace(/ed$/,''),clean.replace(/ly$/,''),clean.replace(/ness$/,''),clean.replace(/s$/,'')];
                if(forms.some(f=>POS_WORDS.has(f))){posCount++;emotionWords.push(clean);}
                else if(forms.some(f=>NEG_WORDS.has(f))){negCount++;emotionWords.push(clean);}
            });
            let sentiment='Neutral';
            if(posCount>negCount*1.4)sentiment='Positive';
            else if(negCount>posCount*1.2)sentiment='Negative';
            const syllables=words.reduce((acc,w)=>{const c=w.toLowerCase().replace(/[^a-z]/g,'');return acc+Math.max(1,c.replace(/[^aeiouy]/g,'').length||1);},0);
            const sentLen=sentences.length>0?words.length/sentences.length:words.length;
            const syllPerWord=words.length>0?syllables/words.length:1;
            const readability=Math.max(0,Math.min(100,Math.round(206.835-1.015*sentLen-84.6*syllPerWord)));
            const wordFreq={};
            words.forEach(w=>{const c=w.toLowerCase().replace(/[^a-z]/g,'');if(c.length>3)wordFreq[c]=(wordFreq[c]||0)+1;});
            const repeatedWords=Object.entries(wordFreq).filter(([,v])=>v>2).map(([k])=>k).slice(0,5);
            const lexicalDiversity=words.length>0?parseFloat((uniqueSet.size/words.length).toFixed(2)):0;
            const wc=words.length||1;
            const sentimentScore=Math.max(0,Math.min(100,Math.round(50+((posCount-negCount)/wc)*50)));
            return{sentiment,wordCount:words.length,sentenceCount:sentences.length,uniqueWords:uniqueSet.size,mistakeCount:0,readability,positiveWordCount:posCount,negativeWordCount:negCount,neutralWordCount:Math.max(0,words.length-posCount-negCount),lexicalDiversity,sentimentScore,sentimentConfidence:0.6,emotionWords:[...new Set(emotionWords)].slice(0,10),repeatedWords,writingStyle:lexicalDiversity>0.7?'Expressive':lexicalDiversity>0.5?'Conversational':'Simple',grammarTrend:'Stable',vocabularyTrend:lexicalDiversity>0.65?'Improving':'Developing',progressSummary:`You wrote ${words.length} words across ${sentences.length} sentences with ${uniqueSet.size} unique words.`,moodLifter:sentiment==='Negative'?'Even the heaviest days carry something worth holding onto.':sentiment==='Positive'?'Your words carry warmth — keep that energy close.':'Every honest reflection is a step toward knowing yourself better.',vocabularySuggestions:[]};
        }

        const templates=[
            {id:'floral',name:'Floral Petals',icon:'🌸'},
            {id:'ruled',name:'Classic Ruled',icon:'📜'},
            {id:'midnight',name:'Midnight Blue',icon:'🌑'},
            {id:'parchment',name:'Old Parchment',icon:'📜'},
            {id:'lavender',name:'Lavender Mist',icon:'🌿'},
            {id:'minimal',name:'Pure Minimalist',icon:'⚪'},
            {id:'matcha',name:'Matcha Tea',icon:'🍵'},
            {id:'sunset',name:'Warm Sunset',icon:'🌇'},
            {id:'noir',name:'Noir Luxury',icon:'🎩'},
            {id:'ocean',name:'Deep Ocean',icon:'🌊'}
        ];

        const FONT_MAP={
            'times':'Times New Roman,Times,serif',
            'bookman':'Bookman Old Style,serif',
            'apple-chancery':'Apple Chancery,cursive',
            'big-caslon':'Big Caslon,serif',
            'bradley-hand':'Bradley Hand,cursive',
            'chalkduster':'Chalkduster,cursive',
            'copperplate':'Copperplate,serif',
            'impact':'Impact,sans-serif',
            'market-felt':'Market Felt,cursive',
            'luminari':'Luminari,fantasy',
            'noteworthy':'Noteworthy,sans-serif',
            'palatino':'Palatino,serif',
            'rockhand':'Rockwell,cursive',
            'snell-roundhand':'Snell Roundhand,cursive',
            'papyrus':'Papyrus,fantasy'
        };

        const DRAFT_KEY='mindnook_canvas_draft';
        let selectedTemplate=null;
        let quill=null;
        let hasUnsavedProgress=false;
        let autosaveTimer=null;

        function showToast(message,{warn=false,duration=3600}={}){
            const stack=document.getElementById('mn-toast-stack');
            if(!stack)return;
            const toast=document.createElement('div');
            toast.className='mn-toast'+(warn?' warn':'');
            toast.setAttribute('role',warn?'alert':'status');
            toast.textContent=message;
            stack.appendChild(toast);
            setTimeout(()=>{
                toast.style.transition='opacity 0.25s ease';
                toast.style.opacity='0';
                setTimeout(()=>toast.remove(),260);
            },duration);
        }

        function readDraft(){
            try{
                const raw=localStorage.getItem(DRAFT_KEY);
                if(!raw)return null;
                const draft=JSON.parse(raw);
                if(!draft||!draft.text||draft.text.trim().length<5)return null;
                return draft;
            }catch(e){return null;}
        }

        function saveDraft(){
            if(!quill||!selectedTemplate)return;
            const text=quill.getText().trim();
            if(text.length<5){localStorage.removeItem(DRAFT_KEY);return;}
            const draft={
                text:text,
                html:quill.root.innerHTML,
                templateId:selectedTemplate.id,
                templateName:selectedTemplate.name,
                savedAt:Date.now()
            };
            try{
                localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));
                const indicator=document.getElementById('autosave-indicator');
                const label=document.getElementById('autosave-text');
                if(indicator&&label){
                    label.textContent='Draft saved';
                    indicator.classList.add('show');
                }
            }catch(e){}
        }

        function clearDraft(){
            localStorage.removeItem(DRAFT_KEY);
            hasUnsavedProgress=false;
        }

        function scheduleAutosave(){
            clearTimeout(autosaveTimer);
            const indicator=document.getElementById('autosave-indicator');
            const label=document.getElementById('autosave-text');
            if(indicator&&label){label.textContent='Saving draft…';indicator.classList.add('show');}
            autosaveTimer=setTimeout(saveDraft,900);
        }

        function updateWordCount(){
            const text=quill.getText().trim();
            const words=text.length?text.split(/\s+/).filter(Boolean):[];
            const sentences=text.split(/[.!?]+/).filter(s=>s.trim().length>0);
            const wcWords=document.getElementById('wc-words');
            const wcSentences=document.getElementById('wc-sentences');
            if(wcWords)wcWords.textContent=words.length;
            if(wcSentences)wcSentences.textContent=sentences.length;
        }

        function initCanvas(){
            const grid=document.getElementById('canvas-grid');
            const startBtn=document.getElementById('start-writing');
            if(!grid)return;

            templates.forEach(t=>{
                const div=document.createElement('div');
                div.className='canvas-square';
                div.setAttribute('tabindex','0');
                div.setAttribute('role','button');
                div.setAttribute('aria-pressed','false');
                div.setAttribute('aria-label',`${t.name} canvas theme`);
                div.innerHTML=`<div class="canvas-square-check">✓</div><div class="canvas-square-icon" aria-hidden="true">${t.icon}</div><p>${t.name}</p>`;
                const selectTemplate=()=>{
                    document.querySelectorAll('.canvas-square').forEach(el=>{el.classList.remove('active');el.setAttribute('aria-pressed','false');});
                    div.classList.add('active');
                    div.setAttribute('aria-pressed','true');
                    selectedTemplate=t;
                    startBtn.disabled=false;
                    startBtn.setAttribute('aria-disabled','false');
                    startBtn.classList.remove('disabled');
                };
                div.onclick=selectTemplate;
                div.onkeydown=(e)=>{
                    if(e.key==='Enter'||e.key===' '){e.preventDefault();selectTemplate();}
                };
                grid.appendChild(div);
            });

            const existingDraft=readDraft();
            if(existingDraft){
                const banner=document.getElementById('draft-banner');
                banner.style.display='flex';
                document.getElementById('draft-resume-btn').onclick=()=>{
                    const match=templates.find(t=>t.id===existingDraft.templateId);
                    selectedTemplate=match||templates[0];
                    document.querySelectorAll('.canvas-square').forEach((el,i)=>{
                        if(templates[i].id===selectedTemplate.id){el.classList.add('active');el.setAttribute('aria-pressed','true');}
                    });
                    launchEditor();
                    quill.root.innerHTML=existingDraft.html;
                    updateWordCount();
                    hasUnsavedProgress=true;
                    showToast('Draft restored.');
                };
                document.getElementById('draft-discard-btn').onclick=()=>{
                    clearDraft();
                    banner.style.display='none';
                    showToast('Draft discarded.');
                };
            }

            const Parchment=Quill.import('parchment');
            const FontAttributor=new Parchment.Attributor.Style('font','font-family',{scope:Parchment.Scope.INLINE,whitelist:Object.keys(FONT_MAP)});
            FontAttributor.add=function(node,value){if(FONT_MAP[value]){node.style.fontFamily=FONT_MAP[value];return true;}return false;};
            FontAttributor.value=function(node){const f=node.style.fontFamily;if(!f)return false;const found=Object.keys(FONT_MAP).find(k=>FONT_MAP[k].split(',')[0].trim()===f.replace(/['"]/g,'').trim());return found||false;};
            Quill.register(FontAttributor,true);

            const Size=Quill.import('formats/size');
            Size.whitelist=['10px','11px','12px','13px','14px','15px','16px','17px','18px','19px','20px','21px','22px','23px','24px','25px','26px','27px','28px','29px','30px'];
            Quill.register(Size,true);

            quill=new Quill('#editor',{
                theme:'snow',
                placeholder:'Start writing whatever is on your mind…',
                modules:{
                    toolbar:[
                        [{'font':Object.keys(FONT_MAP)}],
                        [{'size':Size.whitelist}],
                        ['bold','italic','underline','strike'],
                        [{'color':[]},{'background':[]}],
                        [{'align':[]}],
                        ['clean']
                    ]
                }
            });

            const saveBtn=document.getElementById('save-btn');
            saveBtn.disabled=true;

            quill.on('text-change',()=>{
                const text=quill.getText().trim();
                saveBtn.disabled=text.length<=10;
                updateWordCount();
                hasUnsavedProgress=text.length>0;
                scheduleAutosave();
            });

            document.getElementById('start-writing').onclick=()=>{
                launchEditor();
            };

            function launchEditor(){
                document.getElementById('picker-view').style.display='none';
                const editorView=document.getElementById('editor-view');
                editorView.style.display='block';
                editorView.className=`editor-view theme-${selectedTemplate.id}`;
                document.getElementById('badge').innerText=`${selectedTemplate.icon} ${selectedTemplate.name}`;
                localStorage.setItem('mindnook_canvas_name',selectedTemplate.name);
                localStorage.setItem('mindnook_canvas_id',selectedTemplate.id);
                setTimeout(()=>quill.focus(),50);
            }

            document.getElementById('back-btn').onclick=()=>{
                if(hasUnsavedProgress){
                    const confirmed=window.confirm('You have unsaved writing. Your draft is saved automatically, but leaving now will discard anything after your last autosave. Go back anyway?');
                    if(!confirmed)return;
                }
                document.getElementById('editor-view').style.display='none';
                document.getElementById('picker-view').style.display='flex';
            };

            window.addEventListener('beforeunload',(e)=>{
                if(hasUnsavedProgress&&document.getElementById('editor-view').style.display!=='none'){
                    e.preventDefault();
                    e.returnValue='';
                }
            });

            saveBtn.onclick=async()=>{
                const textContent=quill.getText().trim();
                if(textContent.length<20){showToast('Please write at least a few sentences before saving.',{warn:true});return;}

                if(window.MindNookCrisisScreen){
                    const acuteResult=window.MindNookCrisisScreen.screenForAcuteRisk(textContent);
                    if(acuteResult.triggered){
                        handleAcuteRisk(acuteResult);
                    }
                }

                saveBtn.innerText='Analyzing…';
                saveBtn.disabled=true;
                const htmlContent=quill.root.innerHTML;
                localStorage.setItem('latestJournalText',textContent);

                const{data:{session}}=await supabaseClient.auth.getSession();
                if(!session){showToast('Session expired. Please sign in again.',{warn:true});setTimeout(()=>{window.location.href='login.html';},1200);return;}

                if(window.MindNookBaseline){
                    try{await window.MindNookBaseline.syncGoalsFromSupabase(supabaseClient,session.user.id);}catch(e){}
                }

                let analysis=null;
                try{
                    const response=await fetch(`${SUPABASE_URL}/functions/v1/analyze-journal`,{
                        method:'POST',
                        headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
                        body:JSON.stringify({text:textContent})
                    });
                    if(!response.ok){throw new Error('edge_function_failed');}
                    const raw=await response.json();
                    analysis={
                        sentiment:raw.sentiment||'Neutral',
                        wordCount:raw.wordCount||textContent.split(/\s+/).length,
                        sentenceCount:raw.sentenceCount||textContent.split(/[.!?]+/).filter(s=>s.trim()).length,
                        uniqueWords:raw.uniqueWords||0,
                        mistakeCount:raw.mistakeCount||0,
                        readability:raw.readability||50,
                        positiveWordCount:raw.positiveWordCount||0,
                        negativeWordCount:raw.negativeWordCount||0,
                        neutralWordCount:raw.neutralWordCount||0,
                        lexicalDiversity:raw.lexicalDiversity||0,
                        sentimentScore:raw.sentimentScore||50,
                        sentimentConfidence:raw.sentimentConfidence||0.5,
                        emotionWords:raw.emotionWords||[],
                        repeatedWords:raw.repeatedWords||[],
                        writingStyle:raw.writingStyle||'',
                        grammarTrend:raw.grammarTrend||'',
                        vocabularyTrend:raw.vocabularyTrend||'',
                        progressSummary:raw.progressSummary||'',
                        moodLifter:raw.moodLifter||'',
                        vocabularySuggestions:raw.vocabularySuggestions||[]
                    };
                }catch(err){
                    analysis=localAnalysis(textContent);
                }

                analysis._rawText=textContent;

                let pragmatic=null;
                let temporalTrend=null;
                let goalAlignment=null;
                let utilityScore=null;

                try{
                    if(window.MindNookBaseline){
                        pragmatic=window.MindNookBaseline.classifyPragmatic(textContent);
                        analysis.pragmatic=pragmatic;

                        const entries=await window.MindNookHistory.getHistory(session.user.id,20);
                        temporalTrend=await window.MindNookBaseline.classifyTemporalTrend(entries,{supabaseUrl:SUPABASE_URL,accessToken:session.access_token,userId:session.user.id,mode:'read'});
                        goalAlignment=window.MindNookBaseline.computeGoalAlignment(analysis,entries);
                        analysis.temporalTrend=temporalTrend;
                        analysis.goalAlignment=goalAlignment;

                        const sentimentBaseline=window.MindNookBaseline.computeSentimentBaseline(entries);
                        if(sentimentBaseline){
                            const currentScore=analysis.sentimentScore||50;
                            const baselineDelta=window.MindNookBaseline.computePersonalBaselineDelta(currentScore,sentimentBaseline);
                            analysis.sentimentBaseline=sentimentBaseline;
                            analysis.sentimentBaselineDelta=baselineDelta;
                        }

                        if(pragmatic&&temporalTrend&&goalAlignment){
                            const cfpW=parseFloat(localStorage.getItem('mindnook_cfp')||'0.4');
                            const cfnW=parseFloat(localStorage.getItem('mindnook_cfn')||'0.6');
                            const wTask=parseFloat(localStorage.getItem('mindnook_w_task')||'0.4');
                            const wSafety=parseFloat(localStorage.getItem('mindnook_w_safety')||'0.35');
                            const lambdaPrivacy=parseFloat(localStorage.getItem('mindnook_lambda_privacy')||'0.15');
                            const lambdaAutonomy=parseFloat(localStorage.getItem('mindnook_lambda_autonomy')||'0.10');
                            const autonomyPref=parseFloat(localStorage.getItem('mindnook_autonomy_pref')||'0.5');
                            utilityScore=window.MindNookBaseline.buildUtilityScore(
                                {sentiment:analysis.sentiment,positiveWordCount:analysis.positiveWordCount,negativeWordCount:analysis.negativeWordCount},
                                pragmatic,temporalTrend,goalAlignment,
                                {cfp_weight:cfpW,cfn_weight:cfnW,w_task:wTask,w_safety:wSafety,lambda_privacy:lambdaPrivacy,lambda_autonomy:lambdaAutonomy,autonomy_preference:autonomyPref},
                                entries
                            );
                            const filteredAction=window.MindNookBaseline.applyEthicalFilter(utilityScore.action,entries,analysis);
                            utilityScore.action=filteredAction;
                            await checkPatternEscalation(temporalTrend,utilityScore,session);
                        }
                    }
                }catch(layerErr){
                    console.warn('Layer computation failed (non-fatal):',layerErr.message);
                }

                localStorage.setItem('latestAnalysis',JSON.stringify(analysis));

                let savedEntryId=null;
                try{
                    const insertPayload={
                        user_id:session.user.id,
                        metadata:window.MindNookHistory.buildEntryMetadata({mode:'journal',wordCount:analysis.wordCount||0}),
                        content:htmlContent,
                        sentiment:analysis.sentiment,
                        mood_lifter_content:analysis.moodLifter||'',
                        word_count:analysis.wordCount||0,
                        sentence_count:analysis.sentenceCount||0,
                        mistake_count:analysis.mistakeCount||0,
                        lexical_feedback:analysis.vocabularySuggestions||[],
                        unique_words:analysis.uniqueWords||0,
                        readability:analysis.readability||0,
                        writing_style:analysis.writingStyle||'',
                        grammar_trend:analysis.grammarTrend||'',
                        vocabulary_trend:analysis.vocabularyTrend||'',
                        progress_summary:analysis.progressSummary||'',
                        emotion_words:analysis.emotionWords||[],
                        repeated_words:analysis.repeatedWords||[],
                        positive_word_count:analysis.positiveWordCount||0,
                        negative_word_count:analysis.negativeWordCount||0,
                        neutral_word_count:analysis.neutralWordCount||0,
                        lexical_diversity:analysis.lexicalDiversity||0,
                        sentiment_score:analysis.sentimentScore||null,
                        sentiment_baseline_delta:analysis.sentimentBaselineDelta?.delta||null,
                        layer2_pragmatic:pragmatic||null,
                        layer3_temporal:temporalTrend||null,
                        layer4_goal:goalAlignment||null,
                        layer5_action:utilityScore||null,
                        layer5_breakdown:utilityScore?.breakdown||null,
                        layer_enrichment_status:'pending',
                        created_at:new Date().toISOString()
                    };
                    const{data,error}=await supabaseClient.from('journal_entries').insert([insertPayload]).select();
                    if(!error&&data&&data[0]){
                        savedEntryId=data[0].id;
                        localStorage.setItem('mindnook_last_entry_id',savedEntryId);
                        try{
                            const storedGoals=JSON.parse(localStorage.getItem('mindnook_goals')||'[]');
                            const muUser=analysis.sentimentBaseline?.muUser||null;
                            const tauGoal=window.MindNookBaseline?window.MindNookBaseline.getTauGoal():0.6;
                            fetch(`${SUPABASE_URL}/functions/v1/temporal-lstm`,{
                                method:'POST',
                                headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
                                body:JSON.stringify({mode:'update',sentiment_score:analysis.sentimentScore||50,entry_id:savedEntryId})
                            }).catch(()=>{});
                            try{
                                const r=await fetch(`${SUPABASE_URL}/functions/v1/pragmatic-analysis`,{
                                    method:'POST',
                                    headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
                                    body:JSON.stringify({
                                        type:'combined',content:textContent,sentiment:analysis.sentiment,
                                        sentiment_score:analysis.sentimentScore||50,goals:storedGoals,
                                        entry_id:savedEntryId,trend_direction:temporalTrend?.direction||'neutral',
                                        trend_label:temporalTrend?.label||'stable',trend_slope:temporalTrend?.slope||0,
                                        cfp_weight:parseFloat(localStorage.getItem('mindnook_cfp')||'0.4'),
                                        cfn_weight:parseFloat(localStorage.getItem('mindnook_cfn')||'0.6'),
                                        w_task:parseFloat(localStorage.getItem('mindnook_w_task')||'0.4'),
                                        w_safety:parseFloat(localStorage.getItem('mindnook_w_safety')||'0.35'),
                                        lambda_privacy:parseFloat(localStorage.getItem('mindnook_lambda_privacy')||'0.15'),
                                        lambda_autonomy:parseFloat(localStorage.getItem('mindnook_lambda_autonomy')||'0.10'),
                                        autonomy_preference:parseFloat(localStorage.getItem('mindnook_autonomy_pref')||'0.5'),
                                        positive_word_count:analysis.positiveWordCount||0,
                                        negative_word_count:analysis.negativeWordCount||0,mu_user:muUser,
                                        tau_goal:tauGoal
                                    })
                                });
                                if(r.ok){
                                    const enriched=await r.json();
                                    if(enriched.pragmatic)analysis.pragmatic=enriched.pragmatic;
                                    if(enriched.layer5_action)analysis.utilityScore=enriched.layer5_action;
                                    if(enriched.layer5_action?.breakdown)analysis.utilityScoreBreakdown=enriched.layer5_action.breakdown;
                                    if(enriched.pragmatic)pragmatic=enriched.pragmatic;
                                    if(enriched.layer5_action)utilityScore=enriched.layer5_action;
                                    localStorage.setItem('latestAnalysis',JSON.stringify(analysis));
                                    const lowConfidenceGoal=enriched.goal?.lowConfidenceGoal;
                                    if(lowConfidenceGoal&&window.MindNookGoalClarification){
                                        await window.MindNookGoalClarification.renderClarificationPrompt(lowConfidenceGoal,{
                                            supabaseUrl:SUPABASE_URL,accessToken:session.access_token
                                        });
                                    }
                                }
                            }catch(e){}
                        }catch(e){}
                    }
                }catch(dbErr){
                    console.warn('DB insert failed (non-fatal):',dbErr.message);
                }

                localStorage.setItem('mindnook_last_entry_content',textContent);
                localStorage.setItem('mindnook_last_entry_sentiment',analysis.sentiment);
                clearDraft();

                showPostSaveExplanation({
                    l1:{sentiment:analysis.sentiment,confidence:analysis.sentimentConfidence},
                    l2:pragmatic,
                    l3:temporalTrend,
                    l4:goalAlignment,
                    l5:utilityScore,
                    entryId:savedEntryId,
                    userId:session.user.id,
                    accessToken:session.access_token
                });
            };
        }

        function showPostSaveExplanation(ctx){
            hasUnsavedProgress=false;
            document.getElementById('editor-view').style.display='none';
            const explainView=document.getElementById('explain-view');
            explainView.style.display='flex';
            const container=document.getElementById('explain-panel-container');
            container.innerHTML='';
            if(window.MindNookExplanation){
                window.MindNookExplanation.renderExplanationPanel(container,{l1:ctx.l1,l2:ctx.l2,l3:ctx.l3,l4:ctx.l4,l5:ctx.l5},{
                    supabaseClient:supabaseClient,
                    userId:ctx.userId,
                    entryId:ctx.entryId
                });
            }
            document.getElementById('explain-continue-btn').onclick=()=>{
                window.location.href='sentiment.html';
            };
        }

        async function handleAcuteRisk(acuteResult){
            const session=window.__session;
            const countryCode=localStorage.getItem('mindnook_country')||'international';
            const resource=window.MindNookCrisisBanner?await window.MindNookCrisisBanner.loadResource(countryCode):{name:'International Association for Suicide Prevention',number:'',url:'https://www.iasp.info/resources/Crisis_Centres/'};
            if(window.MindNookCrisisBanner){
                window.MindNookCrisisBanner.renderAcuteBanner(resource,async()=>{
                    if(session&&supabaseClient){
                        try{await supabaseClient.from('escalation_events').update({acknowledged:true}).eq('user_id',session.user.id).eq('type','acute').eq('acknowledged',false);}catch(e){}
                    }
                });
            }
            if(session&&supabaseClient){
                try{await supabaseClient.from('escalation_events').insert([{user_id:session.user.id,type:'acute',confidence:acuteResult.confidence,acknowledged:false}]);}catch(e){}
            }
        }

        async function checkUnacknowledgedEscalation(session){
            if(!session||!supabaseClient)return;
            try{
                const{data}=await supabaseClient.from('escalation_events').select('id').eq('user_id',session.user.id).eq('type','acute').eq('acknowledged',false).limit(1);
                if(data&&data.length&&window.MindNookCrisisBanner){
                    const countryCode=localStorage.getItem('mindnook_country')||'international';
                    const resource=await window.MindNookCrisisBanner.loadResource(countryCode);
                    window.MindNookCrisisBanner.renderAcuteBanner(resource,async()=>{
                        try{await supabaseClient.from('escalation_events').update({acknowledged:true}).eq('user_id',session.user.id).eq('type','acute').eq('acknowledged',false);}catch(e){}
                    });
                }
            }catch(e){}
        }

        async function checkPatternEscalation(l3,l5,session){
            if(!l3||!l5||!session||!supabaseClient)return;
            const decliningPattern=l3.label==='declining';
            const safetyLow=l5.breakdown&&l5.breakdown.safety!=null&&l5.breakdown.safety<0.4;
            if(!decliningPattern||!safetyLow)return;
            const throttleKey=`mindnook_pattern_escalation_${session.user.id}`;
            const last=parseInt(localStorage.getItem(throttleKey)||'0');
            const now=Date.now();
            if(now-last<14*86400000)return;
            localStorage.setItem(throttleKey,String(now));
            try{await supabaseClient.from('escalation_events').insert([{user_id:session.user.id,type:'pattern',confidence:null,acknowledged:false}]);}catch(e){}
            if(window.MindNookCrisisBanner)window.MindNookCrisisBanner.renderPatternCard('editor-view',()=>{});
        }

        async function checkAuthAndInit(){
            const{data:{session}}=await supabaseClient.auth.getSession();
            if(!session){window.location.href='login.html';return;}
            window.__session=session;
            if(window.MindNookBaseline){
                try{await window.MindNookBaseline.loadConsentScopes(supabaseClient,session.user.id);}catch(e){}
                try{await window.MindNookBaseline.syncGoalsFromSupabase(supabaseClient,session.user.id);}catch(e){}
            }
            await checkUnacknowledgedEscalation(session);
            initCanvas();
        }

        checkAuthAndInit();
    </script>
</body>
</html>
